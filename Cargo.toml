[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/craftyderpysmall/blackbubbles"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
regex = "1"
fancy-regex = "0.14"
anyhow = "1"
thiserror = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "fs", "signal"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
sha2 = "0.10"
hex = "0.4"
url = "2"
rand = "0.8"
base64 = "0.22"
serde_json = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
rusqlite = "0.37"
aes-gcm = "0.10"
aes = "0.8"
pbkdf2 = "0.12"
num-bigint = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "cookies", "blocking"] }
